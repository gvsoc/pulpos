from gvtest.testsuite import *
import os
import re
from vcd.reader import TokenKind, tokenize


SIGNALS = ['kernel', 'kernel_id', 'frame', 'busy', 'dma', 'fill', 'macs', 'log']


def check_output(test, output):

    if output.find('Processed 3 frames') == -1:
        return (False, "Didn't find output string\n")

    # Every signal must be in the VCD file (in the work dir of the test, given to gvrun with
    # --work-dir= or to make with build=) and have value changes
    match = re.search(r'(?:--work-dir=|build=)(\S+)', test.test.flags)
    if match is None:
        return (False, "Didn't find the work dir of the test in its flags\n")
    vcd_path = os.path.join(test.test.path, match.group(1), 'all.vcd')
    if not os.path.exists(vcd_path):
        return (False, f"VCD file not found: {vcd_path}\n")

    ids = {}
    changes = {name: 0 for name in SIGNALS}
    scopes = []
    with open(vcd_path, 'rb') as f:
        for token in tokenize(f):
            if token.kind == TokenKind.SCOPE:
                scopes.append(token.data.ident)
            elif token.kind == TokenKind.UPSCOPE:
                scopes.pop()
            elif token.kind == TokenKind.VAR:
                if scopes == ['app'] and token.data.reference in changes:
                    ids[token.data.id_code] = token.data.reference
            elif token.kind in (TokenKind.CHANGE_SCALAR, TokenKind.CHANGE_VECTOR,
                    TokenKind.CHANGE_REAL, TokenKind.CHANGE_STRING):
                name = ids.get(token.data.id_code)
                if name is not None:
                    changes[name] += 1

    missing = [name for name in SIGNALS if changes[name] == 0]
    if len(missing) != 0:
        return (False, f"Signals without values in the VCD: {', '.join(missing)}\n")

    return (True, None)


def testset_build(testset):
    # The checker reads the VCD file, dumped by --vcd for the application signals only
    vcd_flags = '--vcd --event=/app/'
    testset.new_app_test('gui_signals', checker=check_output, gvrun_flags=vcd_flags,
        make_flags=f'run_options="{vcd_flags}"')
