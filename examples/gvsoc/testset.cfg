from gvtest import *

# Called by gvtest to declare the tests
def testset_build(testset):

    testset.set_name('gvsoc')

    # The GVSoC calls (gvsoc.h) are semihosting ebreaks, which some cores do not handle:
    # spatz_v3 sees them with a stale a0 (unknown calls), SoftHier v1 traps on them (and reboots)
    # and SoftHier v2 stops on them.
    target = testset.get_target()
    if target.get_name() not in ['spatz_v3'] and not target.get_property('softhier'):
        testset.import_testset(file='gui_signals/testset.cfg')
