from gvtest import *

# Called by gvtest to declare the tests
def testset_build(testset):

    testset.set_name('gvsoc')

    # spatz_v3 handles the semihosting ebreak of the GVSoC calls (gvsoc.h) with a stale a0, the
    # calls of these examples are then unknown
    if testset.get_target().get_name() not in ['spatz_v3']:
        testset.import_testset(file='gui_signals/testset.cfg')
