from gvtest import *


def testset_build(testset):

    testset.set_name('tests')

    testset.import_testset(file='flash/testset.cfg')
    testset.import_testset(file='kernel/testset.cfg')
    testset.import_testset(file='l2/testset.cfg')
    testset.import_testset(file='hostfs/testset.cfg')

    if testset.get_target().get_property('softhier'):
        testset.import_testset(file='softhier/testset.cfg')
