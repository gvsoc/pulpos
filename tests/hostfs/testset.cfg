from gvtest import *


def testset_build(testset):

    testset.set_name('hostfs')

    # The host (semi-hosting) file system is reached through the EVK BSP's "/host" mount point,
    # which only exists on the gap.gap9.evk target.
    if testset.get_target().get_name() == 'gap.gap9.evk':
        testset.import_testset(file='hostfs_rw/testset.cfg')
