from gvtest import *


def testset_build(testset):

    testset.set_name('hostfs')

    # The host (semi-hosting) file system is reached through the board BSP's
    # "/host" mount point (targets that provide it set the 'hostfs' capability).
    if testset.get_target().get_property('hostfs'):
        testset.import_testset(file='hostfs_rw/testset.cfg')
