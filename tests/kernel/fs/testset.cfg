from gvtest import *


def testset_build(testset):

    testset.set_name('fs')

    if testset.get_target().get_name() == 'gap.gap9.evk':
        testset.import_testset(file='fs_smoke/testset.cfg')
        testset.import_testset(file='fs_partial/testset.cfg')
        testset.import_testset(file='fs_remount/testset.cfg')
        testset.import_testset(file='fs_multi/testset.cfg')
