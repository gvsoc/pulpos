from gvtest import *


def testset_build(testset):

    testset.set_name('alloc')

    if testset.get_target().get_name() == 'gap.gap9.evk':
        testset.import_testset(file='alloc_smoke/testset.cfg')
        testset.import_testset(file='alloc_exhaust/testset.cfg')
        testset.import_testset(file='alloc_fragment/testset.cfg')
        testset.import_testset(file='alloc_align/testset.cfg')
