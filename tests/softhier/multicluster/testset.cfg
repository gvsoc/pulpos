import re
from gvtest.testsuite import *


def check_output(test, output):

    match = re.search(r'SoftHier: (\d+) clusters, (\d+) cores per cluster, (\d+) running', output)
    if match is None:
        return (False, "Didn't find the summary line\n")

    nb_expected = int(match.group(1)) * int(match.group(3))
    nb_ok = len(re.findall(r'Cluster \d+ core \d+: OK', output))
    if nb_ok != nb_expected:
        return (False, f"Only {nb_ok} cores out of {nb_expected} reported OK\n")

    return (True, None)


def testset_build(testset):

    testset.new_app_test('multicluster', checker=check_output)
    # Same test on every core of each cluster
    testset.new_app_test('multicluster_multicore', checker=check_output,
        gvrun_flags='--parameter test/pulpos/multicore=true')
