from gvtest.testsuite import *


def check_output(test, output):
    if output.find('flash_stream OK') == -1:
        return (False, "Didn't find success marker\n")
    return (True, None)


def testset_build(testset):
    # Shorter on RTL, where the full test takes about 11 minutes
    if testset.get_platform() == 'rtl':
        testset.new_app_test('flash_stream', checker=check_output,
            gvrun_flags='--parameter test/short=true', make_flags='SHORT=1')
    else:
        testset.new_app_test('flash_stream', checker=check_output)
