from gvtest import *


def testset_build(testset):

    testset.set_name('flash')

    # Flash-API tests are MRAM-backed today, so gate on gap.gap9.evk.
    if testset.get_target().get_name() == 'gap.gap9.evk':
        testset.import_testset(file='flash_smoke/testset.cfg')
        testset.import_testset(file='flash_rw/testset.cfg')
        testset.import_testset(file='flash_async/testset.cfg')
        testset.import_testset(file='flash_stream/testset.cfg')
        testset.import_testset(file='flash_2d/testset.cfg')
