from gvtest.testsuite import *

# Reference values measured on the GVSoC model (2026-07-16, pulpos/core main) — regression
# locks for the calibration report. Targets without an entry report
# measured-only until their references are captured.
REFS = {
}

def testset_build(testset):

    tests = testset.new_app_test('delayed')
    refs = REFS.get(testset.get_target().get_name(), {})

    def bench(name, extract, desc):
        ref_args = {}
        if name in refs:
            ref_args = dict(ref=refs[name], tol_pct=5, ref_type='measured')
        for test in tests:
            test.add_bench(name, extract, desc, **ref_args)

    for group in ['push_single', 'push', 'cancel_ordered', 'cancel_reverse', 'fire', 'signal_wait']:
        if not group in ['fire', 'signal_wait']:
            bench(f'{group}.cycles_per_iteration',
                rf'    \[{group}\] Cycles per iteration: (\S+)', f'Cycles/iter ({group})')
        bench(f'{group}.active_cycles_per_iteration',
            rf'    \[{group}\] Active cycles per iteration: (\S+)', f'Active cycles/iter ({group})')
        bench(f'{group}.instructions_per_iteration',
            rf'    \[{group}\] Instructions per iteration: (\S+)', f'Instructions/iter ({group})')
